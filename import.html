<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Importar ficha</title>
    <link rel="stylesheet" href="css/style.css?v=0.9.28" />
  </head>
  <body>
    <div class="app">
      <div class="bar"><h1>Importar ficha do PMP</h1><button class="icon" id="close" title="Fechar">✕</button></div>
      <div class="scroll">
        <p class="muted small" style="margin-top: 0">
          No app, abra o Pokémon e use <b>Exportar</b> (copia o código). Cole aqui embaixo.
        </p>
        <textarea id="code" rows="11" placeholder='{"species":{"current":"Bulbasaur", ...}}'></textarea>
        <label class="row small" style="margin-top: 6px">
          <input type="checkbox" id="rename" checked /> Usar o nome do Pokémon no token
        </label>
        <label class="row small" style="margin-top: 6px">
          <input type="checkbox" id="resize" checked /> Ajustar o tamanho do token pela altura do Pokémon (0,8 m = pouco mais de ½ quadrado)
        </label>
        <label class="row small" id="teamRow" style="margin-top: 6px; display: none">
          Equipe:
          <select id="team">
            <option value="inimigos">Inimigos</option>
            <option value="jogadores">Jogadores</option>
            <option value="neutros">Neutros</option>
          </select>
          <span class="muted">(dá pra trocar depois na ficha)</span>
        </label>
        <div class="err" id="err"></div>
        <div class="row">
          <span class="spacer"></span>
          <button id="cancel">Cancelar</button>
          <button class="primary" id="ok">Importar</button>
        </div>
      </div>
    </div>
    <script type="module" src="js/import.js?v=0.9.28"></script>
  </body>
</html>
